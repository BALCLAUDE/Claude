# Budget line → map subsegment rules. Read by budget/etl/classify.py.
#
# Rules are tried in file order and the first match wins, so put specific rules above general ones.
# Every field a rule gives must match (AND):
#   title:         regex on the line title (case-insensitive)
#   exclude:       regex on the title that vetoes the rule
#   pe:            list of PE / P-1 BLI / SAG codes; shell globs allowed (0604*A)
#   exhibit:       list of r1, p1, o1, m1, recon, supp
#   appropriation: list of RDT&E, Procurement, O&M, MilPers, Reconciliation, Supplemental
#   component:     list of Army, Navy, USMC, Air Force, Space Force, Defense-Wide
#   account:       list of account codes (2040A, 3600F ...)
# A rule outputs either `subsegments: {id: weight}` (weights sum to 1) or `not_tech: true`.
# Optional: program (an id from src/data/programs.js), confidence (default 1.0 for pe rules,
# 0.9 for title-only rules), note.
#
# Analyst decisions in budget/overrides/line_sector.csv always win over these rules.

review:
  min_confidence: 0.8          # rule or Claude matches below this go to the review queue
  unreviewed_max_k: 1000000    # non-human mappings of lines this size ($1B) or larger are queued for a look
  unclassified_min_k: 100000   # unclassified RDT&E / Procurement lines from $100M are queued

rules:
  # ------------------------------------------------------------------ out of scope
  - id: milpers
    exhibit: [m1]
    not_tech: true
    note: Military personnel appropriations (pay, allowances, PCS moves).
  - id: milcon
    exhibit: [c1]
    not_tech: true
    note: Military construction and family housing.
  - id: revolving-funds
    exhibit: [rf1]
    not_tech: true
    note: Working capital and other revolving funds.
  - id: om-institutional
    exhibit: [o1]
    title: 'base operations|facilities sustainment|restoration and modernization|recruiting|advertising|examining|specialized skill training|recruit training|officer acquisition|professional development|flight training|training support|off-duty|voluntary education|junior rotc|civilian education|administration|servicewide transportation|personnel programs|other personnel support|family|childcare|morale|welfare|commissar|medical|health|environmental|housing|demolition|claims|legal|audit|accounting|public affairs|chaplain|band|ceremonial|security programs|pentagon reservation'
    not_tech: true
    confidence: 0.9
  - id: acquisition-workforce
    title: 'acq(uisition)? workforce'
    not_tech: true
    confidence: 0.9

  # ------------------------------------------------------------------ space
  - id: golden-dome
