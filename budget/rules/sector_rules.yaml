    confidence: 0.85
  - id: space-isr
    title: 'space[- ]based (air )?moving target|commercial (imagery|remote sensing)|earth observation|space[- ]based (isr|radar|sensing)|\bgmti\b.*space|space.*\bgmti\b|weather (satellite|system)|electro-optical/infrared weather|\bewss\b'
